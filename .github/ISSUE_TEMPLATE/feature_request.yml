name: Idea or feature request
description: Suggest something that would make Twring better.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job you want done, in your own words. What makes it hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working. Rough is fine.
  - type: dropdown
    id: area
    attributes:
      label: Which part of Twring?
      options:
        - Calls and voice
        - Rings and notifications
        - Chats and files
        - Connecting agents or AI apps
        - Running my own server
        - The app in general
        - Something else
